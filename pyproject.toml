[project]
name = "lt25-mcp"
version = "0.1.0"
description = "MCP server for the Fender Mustang LT25 guitar amplifier"
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.0.1",
    "hidapi>=0.15.0",
    "librosa>=1.0.0",
    "matplotlib>=3.11.1",
    "mcp>=2.1.1",
    "protobuf>=7.36.0",
    "soundfile>=0.14.0",
]

[project.scripts]
lt25-mcp = "lt25_mcp.server:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lt25_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src/ directly rather than relying on the editable install.
# uv writes its .pth files with the macOS hidden flag, and CPython >= 3.12
# skips hidden .pth files, which silently breaks editable installs. See
# docs/troubleshooting.md.
pythonpath = ["src"]
